<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explora citas, perros, gatos y datos curiosos con cuatro APIs públicas.">
  <title>Explorador de contenido aleatorio</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <script src="js/app.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <header class="bg-dark text-white border-bottom">
    <div class="container py-4 py-md-5">
      <h1 class="display-5 fw-bold">Explorador de contenido aleatorio</h1>
    </div>
  </header>
  <main class="container py-4">
    <div class="row g-4">
      <section class="col-12 col-md-6 col-xl-3" aria-labelledby="titulo-citas">
        <div id="citas" class="card h-100 border-0 shadow-sm">
          <div class="card-body d-flex flex-column p-4">
            <h2 id="titulo-citas" class="h4">Citas y autores</h2>
            <div data-contenido class="flex-grow-1 d-flex flex-column justify-content-center py-3" hidden>
              <figure class="mb-0"><blockquote class="blockquote"><p id="texto-cita" lang="en"></p></blockquote><figcaption id="autor-cita" class="blockquote-footer mt-3"></figcaption></figure>
            </div>
            <p data-estado role="status" aria-live="polite" class="small text-body-secondary">Cargando…</p>
            <button type="button" class="btn btn-primary w-100 mt-auto">Obtener otra cita</button>
            <a class="small text-body-secondary mt-3" href="https://dummyjson.com/docs/quotes" target="_blank" rel="noopener noreferrer">Fuente: DummyJSON ↗</a>
          </div>
        </div>
      </section>
      <section class="col-12 col-md-6 col-xl-3" aria-labelledby="titulo-perros">
        <div id="perros" class="card h-100 border-0 shadow-sm">
          <div class="card-body d-flex flex-column p-4">
            <h2 id="titulo-perros" class="h4">Perros</h2>
            <div data-contenido class="ratio ratio-4x3 bg-body-tertiary rounded overflow-hidden mb-3" hidden><img id="imagen-perro" class="w-100 h-100 object-fit-contain" alt="Perro seleccionado aleatoriamente por Dog CEO"></div>
            <p data-estado role="status" aria-live="polite" class="small text-body-secondary">Cargando…</p>
            <button type="button" class="btn btn-success w-100 mt-auto">Mostrar otro perro</button>
            <a class="small text-body-secondary mt-3" href="https://dog.ceo/dog-api/documentation/random" target="_blank" rel="noopener noreferrer">Fuente: Dog CEO ↗</a>
          </div>
        </div>
      </section>
      <section class="col-12 col-md-6 col-xl-3" aria-labelledby="titulo-gatos">
        <div id="gatos" class="card h-100 border-0 shadow-sm">
          <div class="card-body d-flex flex-column p-4">
            <h2 id="titulo-gatos" class="h4">Gatos</h2>
            <div data-contenido class="ratio ratio-4x3 bg-body-tertiary rounded overflow-hidden mb-3" hidden><img id="imagen-gato" class="w-100 h-100 object-fit-contain" alt="Gato seleccionado aleatoriamente por CATAAS"></div>
            <p data-estado role="status" aria-live="polite" class="small text-body-secondary">Cargando…</p>
            <button type="button" class="btn btn-warning w-100 mt-auto">Mostrar otro gato</button>
            <a class="small text-body-secondary mt-3" href="https://cataas.com/" target="_blank" rel="noopener noreferrer">Fuente: CATAAS ↗</a>
          </div>
        </div>
      </section>
      <section class="col-12 col-md-6 col-xl-3" aria-labelledby="titulo-datos">
        <div id="datos" class="card h-100 border-0 shadow-sm">
          <div class="card-body d-flex flex-column p-4">
            <h2 id="titulo-datos" class="h4">Datos curiosos</h2>
            <div data-contenido class="flex-grow-1 d-flex align-items-center py-3" hidden><p id="texto-dato" class="fs-5" lang="en"></p></div>
            <p data-estado role="status" aria-live="polite" class="small text-body-secondary">Cargando…</p>
            <button type="button" class="btn btn-info w-100 mt-auto">Mostrar otro dato</button>
            <a class="small text-body-secondary mt-3" href="https://uselessfacts.jsph.pl/" target="_blank" rel="noopener noreferrer">Fuente: Useless Facts ↗</a>
          </div>
        </div>
      </section>
    </div>
    <noscript><div class="alert alert-warning mt-4">Activa JavaScript para consultar las cuatro APIs.</div></noscript>
  </main>
</body>
</html>
